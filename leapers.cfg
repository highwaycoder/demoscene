# leapers.cfg -- leaper definitions for Trapped Knight.
#
# One leaper per line:   name = a b c
# A leaper jumps so the sorted |x|,|y|,|z| of its move equal {a,b,c}.
# Give two numbers for a flat 2D-style piece (c defaults to 0); give all
# three for a genuinely 3D piece. Commas are optional. Edit and save --
# this file hot-reloads, and scenes.cfg refers to these names.

knight   = 1 2
zebra    = 2 3
antelope = 3 4
camel    = 1 3
giraffe  = 1 4
ferz     = 1 1
wazir    = 1 0
alfil    = 2 2
dabbaba  = 2 0

# 3D-native -- these step on all three axes at once
unicorn  = 1 1 1
wyvern   = 2 1 1

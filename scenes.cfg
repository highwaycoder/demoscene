# scenes.cfg -- Trapped Knight presets.
# Edit and save while the program runs; it hot-reloads. Cycle scenes with Tab.
#
#   mode    = trapped | competitive
#   dim     = 2 | 3            (competitive only; 3 = growing sphere)
#   leaper  = a leaper name defined in leapers.cfg (trapped mode)
#   armies  = comma-separated leaper names from leapers.cfg (competitive)
#   tint    = comma-separated #rrggbb, one per army (competitive)
#   pieces  = piece count cap (competitive; up to 800000, also live via - / =)
#   growth  = shells revealed per second (0 / omit = fast default)
#   palette = 0..4  (trapped path colours)
#
# Note: armies of one long-reach leaper (e.g. antelope) interleave very
# finely and tend to wash out; mixed leapers give the clearest territories.

[3D Duel]
mode    = competitive
dim     = 3
armies  = knight, knight
tint    = #ff2a3a, #2a8bff
pieces  = 80000
growth  = 88

